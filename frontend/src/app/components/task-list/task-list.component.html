<h2>Tasks</h2>

<label>
  Status
  <select (change)="onStatusFilterChange($any($event.target).value)">
    <option value="">All</option>
    @for (status of statuses; track status) {
      <option [value]="status">{{ status }}</option>
    }
  </select>
</label>

<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>User</th>
      <th>Status</th>
      <th>Priority</th>
      <th>Created</th>
    </tr>
  </thead>
  <tbody>
    @for (task of tasks(); track task.id) {
      <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.userName }}</td>
        <td>{{ task.status }}</td>
        <td>{{ task.additionalData?.priority ?? '-' }}</td>
        <td>{{ task.createdAt | date: 'yyyy-MM-dd HH:mm' }}</td>
      </tr>
    }
  </tbody>
</table>
